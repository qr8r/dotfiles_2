set $locker swaylock -f -i $wallpaper
set $shots_dir $HOME/Pictures/Screenshots

bindsym $mod+Shift+s exec grim -g "$(slurp)" - | wl-copy
bindsym $mod+Shift+p exec sh -c 'grim -g "$(slurp)" "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png"'
bindsym $mod+Shift+o exec sh -c 'ls -t "$HOME/Pictures/Screenshots" 2>/dev/null | fuzzel --dmenu | xargs -r -I{} xdg-open "$HOME/Pictures/Screenshots/{}"'
bindsym $mod+Ctrl+l exec $locker

exec_always --no-startup-id sh -c 'mkdir -p "$HOME/Pictures/Screenshots"'

exec_always --no-startup-id swayidle -w \
    timeout 300 '$locker' \
    timeout 600 'swaymsg "output * dpms off"' \
    resume 'swaymsg "output * dpms on"' \
    before-sleep '$locker'
