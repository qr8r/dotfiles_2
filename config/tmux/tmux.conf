# Minimal tmux config (Monokai, C-a prefix)

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Behavior
set -g mouse off
set -g mode-keys vi
set -g status-keys vi
set -s extended-keys on
set -g xterm-keys on
set -g history-limit 10000
set -s escape-time 10
set -g repeat-time 300

# Terminal and colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Monokai palette (from terminal theme)
set -g status-style "fg=#f8f8f2,bg=#272822"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#f8f8f2,bg=#272822,bold] #S "
set -g status-right "#{prefix_highlight}#[fg=#a6e22e,bg=#272822] %Y-%m-%d #[fg=#66d9ef,bg=#272822] %H:%M "
set -g window-status-style "fg=#75715e,bg=#272822"
set -g window-status-current-style "fg=#272822,bg=#a6e22e,bold"
set -g window-status-separator "  "
set -g pane-border-style "fg=#75715e"
set -g pane-active-border-style "fg=#66d9ef"
set -g message-style "fg=#272822,bg=#f4bf75"

# Key bindings
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind Space next-layout
bind Tab last-window
bind c new-window -c "#{pane_current_path}"

# Copy mode (vi)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Plugins (TPM)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$XDG_DATA_HOME/tmux/plugins"
set-environment -g TMUX_FZF_LAUNCH_KEY "s"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-prefix-highlight"
set -g @plugin "sainnhe/tmux-fzf"

set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

set -g @prefix_highlight_fg "#272822"
set -g @prefix_highlight_bg "#f4bf75"
set -g @prefix_highlight_show_copy_mode "on"

# Using XDG variables didn't seem to be working. trying hardcoding :(
run ~/.local/share/tmux/plugins/tpm/tpm
